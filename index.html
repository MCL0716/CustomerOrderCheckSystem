<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>客戶訂單比對系統</title>
  <style>
    .gray-text { color: gray; font-size: 8em; font-weight: bold; }
    .green-text { color: green; font-size: 3em; font-weight: bold; }
    .red-text { color: red; font-size: 6em; font-weight: bold; }
    .yellow-text { color: yellow; font-size: 3em; font-weight: bold; }
    .blue-text { color: blue; font-size: 3em; font-weight: bold; }
    .large-blue-text { color: blue; font-size: 10em; font-weight: bold; }
    .box {
      width: 30%; height: 200px; border: 1px solid black;
      margin: 10px; padding: 10px; overflow-y: scroll;
      display: inline-block; vertical-align: top;
    }
    #result, #final_result { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>客戶訂單比對系統</h1>

  <label for="fileInput">上傳 [客戶訂單] (*必要):</label>
  <input type="file" id="fileInput" accept=".txt"><br><br>

  <label for="numInput">輸入 [貨號]:</label>
  <input type="text" id="numInput">
  <button id="checkNum">比對</button>

  <p id="result"></p>
  <p id="final_result"></p>

  <button id="downloadModifiedA" style="display: inline;">下載 [客戶訂單_更新版]</button>
  <button id="downloadB" style="display: none;">下載 [已輸入貨號]</button>
  <button id="downloadC" style="display: none;">下載 [已命中貨號]</button>

  <br><br>
  <div class="box" id="boxA"><strong>客戶訂單_更新版:</strong><br></div>
  <div class="box" id="boxB"><strong>已輸入貨號:</strong><br></div>
  <div class="box" id="boxC"><strong>已命中貨號:</strong><br></div>

  <script>
    let userEntries = [], bEntries = [], cEntries = [], inputCount = 0;
    const M1Sound = 'M1.mp4';
    const M2Sound = 'M2.mp4';

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        userEntries = e.target.result.split('\n').map(x => x.trim()).filter(x => x);
        alert('[客戶訂單] 已上傳');
        updateBoxA();
        toggleDownloadButton();
      };
      reader.readAsText(file);
    });

    function playSound(file) {
      if (!file) return;
      new Audio(file).play();
    }

    function checkNum() {
      inputCount++;
      let inputNum = document.getElementById('numInput').value.trim().replace(/\s+/g, '').toLowerCase();
      document.getElementById('numInput').value = '';
      const resultElement = document.getElementById('result');
      const finalElement = document.getElementById('final_result');
      resultElement.innerHTML = ''; finalElement.innerHTML = '';

      if (!inputNum) return;

      const countDisplay = `<span class="gray-text">#${inputCount}</span><br>`;
      const matchedIndex = userEntries.findIndex(e => e.split(':')[1]?.replace(/\s+/g, '').toLowerCase() === inputNum);

      if (matchedIndex !== -1) {
        const hit = userEntries[matchedIndex];
        userEntries.splice(matchedIndex, 1);
        cEntries.unshift(hit);
        resultElement.innerHTML = `${countDisplay}<span class="red-text">${hit}</span> - 命中客戶訂單 - 插入資料於 [已命中貨號]`;
        playSound(M2Sound);
        updateBoxA(); updateBoxC();
      } else {
        bEntries.unshift(inputNum);
        resultElement.innerHTML = `${countDisplay}<span class="green-text">${inputNum}</span> - 未命中客戶訂單 - 插入資料於 [已輸入貨號]`;
        playSound(M1Sound);
        updateBoxB();
      }

      toggleDownloadButton();

      if (userEntries.length === 0) {
        document.getElementById('numInput').style.display = 'none';
        document.getElementById('checkNum').style.display = 'none';
        finalElement.innerHTML = `<span class="large-blue-text">已完成客戶訂單比對</span>`;
      }
    }

    function toggleDownloadButton() {
      document.getElementById('downloadB').style.display = 'inline';
      document.getElementById('downloadC').style.display = 'inline';
    }

    document.getElementById('checkNum').addEventListener('click', checkNum);
    document.getElementById('numInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkNum();
    });

    document.getElementById('downloadModifiedA').addEventListener('click', () => {
      downloadFile(userEntries.join('\n'), '客戶訂單_更新版.txt');
    });
    document.getElementById('downloadB').addEventListener('click', () => {
      downloadFile(bEntries.join('\n'), '已輸入貨號.txt');
    });
    document.getElementById('downloadC').addEventListener('click', () => {
      downloadFile(cEntries.join('\n'), '已命中貨號.txt');
    });

    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function updateBoxA() {
      document.getElementById('boxA').innerHTML = `<strong>客戶訂單_更新版:</strong><br>${userEntries.join('<br>')}`;
    }
    function updateBoxB() {
      document.getElementById('boxB').innerHTML = `<strong>已輸入貨號:</strong><br>${bEntries.join('<br>')}`;
    }
    function updateBoxC() {
      document.getElementById('boxC').innerHTML = `<strong>已命中貨號:</strong><br>${cEntries.join('<br>')}`;
    }
  </script>
</body>
</html>
